name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ansible-core ansible-lint
      - run: make lint
      - run: make test
