---
# User that owns deployments and is used by Ansible after the bootstrap run.
deploy_user: deploy
deploy_ssh_public_key_path: ~/.ssh/hetzner_vps.pub

timezone: America/Fortaleza

# Ports open in the host firewall (ufw). Must match the Hetzner cloud firewall in terraform/.
firewall_allowed_tcp_ports: [22, 80, 443]

swap_size_mb: 2048
swap_swappiness: 10

domain: diegoponte.dev
stacks_dir: /opt/stacks
# Shared Docker network "web". The IPv6 subnet is a private ULA range (fd00::/8), like 10.0.0.0/8 for IPv4.
docker_web_subnet_ipv4: 172.18.0.0/16
docker_web_subnet_ipv6: fd4d:6f6e:6974::/64
# Started in this order; caddy first so the others are reachable as soon as they start.
stacks_enabled: [caddy, uptime-kuma, portfolio, flamengo-news, today, geral]
# Stacks deployed automatically when a new image is pushed (docs/features/auto-deploy.md).
auto_update_stacks: [portfolio, flamengo-news, today, geral]
# admin_cidrs comes from Terraform (terraform.tfvars) through the generated inventory.
# Urubu News (Flamengo newsletter) sign-up page. Secrets come from the admin machine's environment
# (~/.config/infra/secrets.env, sourced by `make configure`), never from the repo.
flamengo_news_public_url: "https://urubunews.{{ domain }}"
flamengo_news_sender: "Urubu News <news@{{ domain }}>"
# The VPS asks the app every 10 min which edition is due and dispatches it (Actions hourly cron: backup).
newsletter_trigger_repo: dpontejs/flamengo-news
# Off since the Urubu News moved into the Geral (its editions now go out through geral-trigger).
# The units stay installed: setting this back to true is the way back.
newsletter_trigger_enabled: false
# Geral (newsletters per team, takes over the Urubu News later). Same Resend account and sender
# domain as the Urubu; its own signing secret and API token. geral@ sends the hub's own e-mails
# (confirmation); each newsletter sends from its own mailbox (teams.toml `sender`, geral repo).
geral_public_url: "https://geral.{{ domain }}"
geral_sender: "Geral <geral@{{ domain }}>"
# The VPS asks the Geral every 10 min which team editions are due and dispatches each one.
geral_trigger_repo: dpontejs/geral
geral_trigger_schedule: "*:0/10"
newsletter_trigger_schedule: "*:0/10"
