---
- name: Harden and configure the VPS
  hosts: vps
  become: true
  roles:
    - base
    - users
    - firewall
    - fail2ban
    - swap
    - docker
    - stacks
    - deploy_agent
    # Last on purpose: root SSH login is disabled only after everything else ran,
    # and the restart happens in a handler at the very end of the play.
    - ssh
