---
- name: Install fail2ban
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]
    state: present

- name: Configure fail2ban jails
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban on boot
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
