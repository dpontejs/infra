---
# GitHub drops scheduled Actions runs under load, so the VPS presses the button at 08:00 BRT.
# The workflow's own cron (08:23) is the backup; `skip_if_sent` keeps the edition from going out twice.
- name: Require the GitHub token that dispatches the newsletter
  ansible.builtin.assert:
    that: lookup('env', 'FLAMENGO_NEWS_GITHUB_TOKEN') | length > 0
    fail_msg: >-
      Set FLAMENGO_NEWS_GITHUB_TOKEN in ~/.config/infra/secrets.env: a fine-grained token with access
      to {{ newsletter_trigger_repo }} only and the "Actions: Read and write" permission.
    quiet: true
  no_log: true

- name: Install the newsletter trigger
  ansible.builtin.copy:
    src: newsletter-trigger
    dest: /usr/local/bin/newsletter-trigger
    owner: root
    group: root
    mode: "0755"

- name: Write the trigger's token (read by systemd only)
  ansible.builtin.template:
    src: newsletter-trigger.env.j2
    dest: /etc/newsletter-trigger.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the trigger's systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [newsletter-trigger.service, newsletter-trigger.timer]
  notify: Reload systemd for the newsletter trigger

- name: Apply unit changes before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable the newsletter trigger timer
  ansible.builtin.systemd_service:
    name: newsletter-trigger.timer
    state: started
    enabled: true
