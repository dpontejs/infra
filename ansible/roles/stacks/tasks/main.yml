---
- name: Require admin CIDRs (they protect the admin panels)
  ansible.builtin.assert:
    that: admin_cidrs is defined and admin_cidrs is iterable and admin_cidrs | length > 0
    fail_msg: "admin_cidrs is missing: run `make plan && make apply` so Terraform exposes it, then retry."

- name: Install Docker SDK for Python (used by the community.docker modules)
  ansible.builtin.apt:
    name: python3-docker
    state: present

# IPv6 must be enabled on the network: otherwise Docker accepts IPv6 connections in a userland
# proxy and forwards them over IPv4, and Caddy sees Docker's gateway (172.18.0.1) instead of the
# visitor's IP, which breaks the admin allowlist (remote_ip).
- name: Create shared network for services behind Caddy
  community.docker.docker_network:
    name: web
    enable_ipv6: true
    ipam_config:
      - subnet: "{{ docker_web_subnet_ipv4 }}"
      - subnet: "{{ docker_web_subnet_ipv6 }}"

- name: Copy stacks to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../stacks/"
    dest: "{{ stacks_dir }}/"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: u=rwX,g=rX,o=rX
  notify: Reload caddy

- name: Write Caddy environment
  ansible.builtin.template:
    src: caddy.env.j2
    dest: "{{ stacks_dir }}/caddy/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  notify: Restart caddy

- name: Require Flamengo News secrets
  ansible.builtin.assert:
    that:
      - lookup('env', 'FLAMENGO_NEWS_SUBSCRIBE_SECRET') | length >= 32
      - lookup('env', 'FLAMENGO_NEWS_API_TOKEN') | length >= 32
      - lookup('env', 'FLAMENGO_NEWS_RESEND_API_KEY') | length > 0
    fail_msg: >-
      Set FLAMENGO_NEWS_SUBSCRIBE_SECRET and FLAMENGO_NEWS_API_TOKEN (32+ chars, e.g. `openssl rand -hex 32`)
      and FLAMENGO_NEWS_RESEND_API_KEY in ~/.config/infra/secrets.env.
    quiet: true
  no_log: true
  when: "'flamengo-news' in stacks_enabled"

- name: Write Flamengo News environment
  ansible.builtin.template:
    src: flamengo-news.env.j2
    dest: "{{ stacks_dir }}/flamengo-news/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true
  when: "'flamengo-news' in stacks_enabled"
  notify: Restart flamengo-news

- name: Start stacks
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_dir }}/{{ item }}"
    state: present
    pull: missing
  loop: "{{ stacks_enabled }}"
