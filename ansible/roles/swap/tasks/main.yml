---
# One idempotent step: `creates` skips it when /swapfile already exists.
- name: Create, format and enable swap file
  ansible.builtin.shell: |
    set -e
    fallocate -l {{ swap_size_mb }}M /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
  args:
    creates: /swapfile
    executable: /bin/bash

- name: Mount swap on boot
  ansible.posix.mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness }}"
    state: present
