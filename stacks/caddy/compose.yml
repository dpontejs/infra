services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ADMIN_CIDRS: ${ADMIN_CIDRS:?set ADMIN_CIDRS in .env}
    volumes:
      # A directory, not the single file: tools that replace the file (Ansible, editors) create a
      # new inode, and a single-file bind mount would keep showing the old content.
      - ./conf:/etc/caddy:ro
      - ./site:/srv/portfolio:ro
      - caddy_data:/data        # certificates and ACME account: losing it means re-issuing everything
      - caddy_config:/config
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    external: true
