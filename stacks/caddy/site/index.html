<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diego Ponte</title>
  <meta name="description" content="Diego Ponte — Machine Learning Engineer. Portfolio coming soon.">
  <style>
    :root { --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --blue: #306998; --yellow: #FFD43B; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9ca3af; --blue: #4B8BBE; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .25rem; color: var(--blue); }
    .bar { width: 64px; height: 4px; margin: 1rem auto; background: var(--yellow); border-radius: 2px; }
    p { color: var(--muted); line-height: 1.6; margin: .5rem 0; }
    nav { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
    a { color: var(--blue); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Diego Ponte</h1>
    <p>Machine Learning Engineer · AI Engineering &amp; Computer Vision · Deep Learning, RAG &amp; LLMs</p>
    <div class="bar"></div>
    <p>Portfolio coming soon.</p>
    <nav>
      <a href="https://github.com/dpontejs">GitHub</a>
      <a href="https://linkedin.com/in/diegopontejs">LinkedIn</a>
      <a href="mailto:dpontejs@gmail.com">Email</a>
    </nav>
  </main>
</body>
</html>
